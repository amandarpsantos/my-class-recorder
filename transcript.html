<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <title>Class Transcript</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="transcript-page">
    <header class="transcript-header">
      <div>
        <h1>Class Transcript</h1>
        <p id="metadata" class="muted">Loading...</p>
        <p id="dashboardStatus" class="muted"></p>
      </div>

      <div class="button-row">
        <button id="copyFullBtn">Copy Full Transcript</button>
        <button id="copyCleanBtn" class="secondary">Copy Clean Text</button>
      </div>
    </header>

    <section id="transcriptContainer" class="transcript-container">
      Loading transcript...
    </section>
  </main>

  <script src="transcript.js"></script>
</body>
</html>
