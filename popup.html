<!DOCTYPE html>
<html>
<head>
  <title>My Class Recorder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup">
    <h1>My Class Recorder</h1>

    <p id="status" class="status">Status: loading...</p>

    <button id="startBtn">Start Recording</button>
    <button id="stopBtn" disabled>Stop Recording</button>

    <button id="reprocessBtn" class="secondary">Reprocess Saved Recordings</button>
    <button id="settingsBtn" class="secondary">Settings</button>
    <button id="micBtn" class="secondary">Microphone Permission</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
